<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wellington Speedcubing Venues</title>
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/filters.css">
    <link rel="stylesheet" href="./css/cards.css">
    <link rel="stylesheet" href="./css/searchBar.css">

</head>
<body>
    <header>
        <h1>Wellington Competition Venues</h1>
    </header>

    <main>
        
        <div class="filters">
            <label>
                <input type="radio" name="filter" value="all" checked>
                All
            </label>
            <label>
                <input type="radio" name="filter" value="feasible">
                Feasible Venues
            </label>
            <label>
                <input type="radio" name="filter" value="pbq">
                PBQ Venues
            </label>
            <label>
                <input type="radio" name="filter" value="potentially feasible">
                Potentially Feasible Venues
            </label>
            <label>
                <input type="radio" name="filter" value="not feasible">
                Unfeasible Venues
            </label>
        </div>

        <div class="search-bar">
            <input type="text" id="search-input" placeholder="Search venues...">
        </div>
        <div id="venue-list" class="venue-list"></div>
                <footer>
            <p><a href="https://github.com/OWelton-Rosie/wlg-comp-venues" target="_blank">Source code on GitHub</a></p>
            <p><a href="https://docs.google.com/forms/d/e/1FAIpQLSeUL7smwdQPWHp1Xgl7rZnyWGPUghqX8f7n7u0uj4lg8JkvlA/viewform?usp=header" target="_blank">Request a change</a></p>
            <p><a href="./about.html">About this site</a></p>
        </footer>
    </main>

    <script type="module">
import { fetchVenues, venues } from './js/data.js';
import { displayVenues } from './js/ui.js';
import { initFilters } from './js/filters.js';
import { initSearch } from './js/search.js';

// Fetch venues first
await fetchVenues();

// Display all venues
displayVenues(venues);

// Initialize filter logic
initFilters();

// Initialize search
initSearch(venues, displayVenues);

    </script>
    
</body>
</html>

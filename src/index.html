<!DOCTYPE html>
<html lang="en-NZ">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wellington Competition Venues</title>
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/filters.css">
    <link rel="stylesheet" href="./css/cards.css">
    <link rel="stylesheet" href="./css/searchBar.css">
    <link rel="stylesheet" href="./css/themeToggle.css">
    <style>
        /* Hide main content by default, show only if JS runs */
        #js-content {
            display: none;
        }
    </style>
</head>
<body>
    <noscript>
        <div style="padding: 2rem; text-align: center; font-size: 1.2rem; color: red;">
            This site requires JavaScript to function. Please enable JavaScript in your browser.
        </div>
    </noscript>

    <div id="js-content">
        <header>
            <h1>Wellington Competition Venues</h1>
            <button id="theme-toggle">🌙 Dark Mode</button>
            <br>
            <br>
            <p><a href="./about.html">About this app</a></p>
            <p>Note: <strong>BEFORE</strong> contacting a venue, you should first contact your local delegate.</p>

        </header>

        <main>
            <div class="filters">
                <label>
                    <input type="radio" name="filter" value="all" checked>
                    All venues
                </label>
                <label>
                    <input type="radio" name="filter" value="feasible">
                    Feasible venues
                </label>
                <label>
                    <input type="radio" name="filter" value="pbq">
                    PBQ venues
                </label>
                <label>
                    <input type="radio" name="filter" value="potentially feasible">
                    Potentially feasible venues
                </label>
                <label>
                    <input type="radio" name="filter" value="unfeasible">
                    Unfeasible venues
                </label>
            </div>

            <div class="search-bar">
                <input type="text" id="search-input" placeholder="Search venues">
            </div>

            <br>

            <div class="center-wrapper">
            <p>Note that venue information and details are subject to change. To have something corrected, make a <a href="https://docs.google.com/forms/d/e/1FAIpQLSeUL7smwdQPWHp1Xgl7rZnyWGPUghqX8f7n7u0uj4lg8JkvlA/viewform?usp=header" target="_blank">change request</a>.</p>
            </div>


            <div id="venue-list" class="venue-list"></div>
        </main>

        <div id="footer"></div>
        <script src="./js/footer.js"></script>
      
    </div>

    <script type="module">
        // Show JS content
        document.getElementById('js-content').style.display = 'block';

        import { fetchVenues, venues } from './js/data.js';
        import { displayVenues } from './js/ui.js';
        import { initFilters } from './js/filters.js';
        import { initSearch } from './js/search.js';
        import { initThemeToggle } from './js/themeToggle.js';
        
        // Fetch venues first
        await fetchVenues();
        
        // Display all venues
        displayVenues(venues);
        
        // Initialize filter logic
        initFilters();
        
        // Initialize search
        initSearch(venues, displayVenues);
        
        // Initialize theme toggle
        initThemeToggle();
    </script>
</body>
</html>
